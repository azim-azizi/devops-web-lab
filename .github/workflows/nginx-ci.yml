name: NGINX build and test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f Containerfile -t azim-web:ci .

      - name: Test the NGINX configuration
        run: docker run --rm azim-web:ci nginx -t

      - name: Test the homepage
        run: |
          docker run -d --name azim-web-ci -p 127.0.0.1:8080:80 azim-web:ci
          curl --retry 10 --retry-connrefused -fsS http://127.0.0.1:8080/ -o /tmp/homepage.html
          grep -F "<h1>Azim's DevOps Lab</h1>" /tmp/homepage.html
          echo "HTTP smoke test passed"
